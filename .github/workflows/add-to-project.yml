name: Add to Project

on:
  pull_request_target:
  issues:
    types:
      - opened
      - reopened

jobs:
  add-to-project:
    name: Add to project
    runs-on: ubuntu-latest
    env:
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
    steps:
      - name: Skip when project token is not configured
        if: ${{ env.PROJECTS_TOKEN == '' }}
        run: echo "PROJECTS_TOKEN is not configured; skipping project assignment."
      - uses: actions/add-to-project@v2.0.0
        if: ${{ env.PROJECTS_TOKEN != '' }}
        with:
          project-url: https://github.com/orgs/fastapi/projects/2
          github-token: ${{ env.PROJECTS_TOKEN }}
